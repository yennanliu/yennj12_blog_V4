<!-- Top Banner Link -->
<div class="top-banner">
    <div class="container">
        <a href="https://yennj12.js.org/" class="banner-link">
            <span class="banner-text">← Back to Main Site</span>
        </a>
    </div>
</div>

<header class="header">
    <div class="container">
        <div class="header__content">
            <div class="header__brand">
                <a href="{{ .Site.BaseURL }}" class="header__logo">
                    <span class="header__title">{{ .Site.Title }}</span>
                </a>
                <p class="header__tagline">{{ .Site.Params.description }}</p>
            </div>
            
            <nav class="header__nav" role="navigation">
                <div class="nav__menu">
                    {{ range .Site.Menus.main }}
                    <a href="{{ .URL | relLangURL }}" class="nav__link{{ if $.IsMenuCurrent "main" . }} nav__link--active{{ end }}">
                        {{ .Name }}
                    </a>
                    {{ end }}
                </div>
                
                <div class="nav__search">
                    <button class="search__toggle" type="button" aria-label="Search">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </nav>
        </div>
    </div>
</header>

<div class="search__overlay" id="searchOverlay">
    <div class="search__modal">
        <div class="search__header">
            <input type="text" class="search__input" placeholder="Search articles…" id="searchInput"
                   autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
                   role="combobox" aria-expanded="false" aria-controls="searchResults" aria-autocomplete="list">
            <button class="search__close" type="button" aria-label="Close search">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                    <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
        <div class="search__results" id="searchResults" role="listbox" aria-label="Search results"></div>
        <div class="search__footer" id="searchFooter" style="display:none">
            <span class="search__hints"><kbd>↑</kbd><kbd>↓</kbd> navigate · <kbd>↵</kbd> open · <kbd>esc</kbd> close</span>
            <a id="searchViewAll" class="search__view-all" href="{{ "search/" | relURL }}">View all results →</a>
        </div>
    </div>
</div>
