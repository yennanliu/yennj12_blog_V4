baseURL = 'https://yennj12.js.org/yennj12_blog_V4'
languageCode = 'en-us'
title = 'YennJ12 Engineering Blog'
theme = 'uber-style'
buildFuture = true
paginate = 25

[params]
  description = 'Engineering insights, architecture deep dives, and technical solutions'
  author = 'YennJ12 Engineering Team'
  twitter = '@yennj12'
  # Open Graph wants the underscored form (en_US), not the BCP-47 languageCode.
  ogLocale = 'en_US'

  # Default social preview card, used as og:image / twitter:image for every page
  # that does not set its own `image:` in front matter. Regenerate the file with
  # `python3 scripts/generate_og_image.py` after a branding change.
  images = ['images/og-default.png']
  imageAlt = 'YennJ12 Engineering Blog — Engineering Excellence, Redefined'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = 'monokai'
    lineNos = true
    codeFences = true
    lineNumbersInTable = false
    noClasses = false

[markup.goldmark.parser]
    attribute = true

[markup.goldmark.extensions]
    definitionList = true
    footnote = true
    linkify = true
    strikethrough = true
    table = true
    taskList = true
    typographer = true

[taxonomies]
  category = 'categories'
  tag = 'tags'
  author = 'authors'

# Primary navigation.
#
# The "Topics" dropdown is NOT listed here — it is generated from the category
# taxonomy at render time (see layouts/partials/header.html) so that
# content/categories/*/_index.md stays the single source of truth for what
# categories exist, how they are titled and in what order they appear.
[menu]
  [[menu.main]]
    identifier = 'home'
    name = 'Home'
    url = '/'
    weight = 10

  [[menu.main]]
    identifier = 'topics'
    name = 'Topics'
    url = '/categories/'
    weight = 20

  [[menu.main]]
    identifier = 'series'
    name = 'Series'
    url = '/tags/'
    weight = 30

  [[menu.main]]
    parent = 'series'
    name = 'FDE Interview Guide'
    url = '/tags/fde/'
    weight = 10
    [menu.main.params]
      note = 'Forward-deployed engineering, end to end'
  [[menu.main]]
    parent = 'series'
    name = 'FDE Core Topics'
    url = '/tags/fde-core-topic/'
    weight = 20
    [menu.main.params]
      note = 'The recurring themes, deep-dived'
  [[menu.main]]
    parent = 'series'
    name = 'AI Engineering'
    url = '/tags/ai-engineering/'
    weight = 30
    [menu.main.params]
      note = 'From zero to production AI systems'
  [[menu.main]]
    parent = 'series'
    name = '10-K Deep Dives'
    url = '/tags/10-k/'
    weight = 40
    [menu.main.params]
      note = 'Institutional-grade filing digests'
  [[menu.main]]
    parent = 'series'
    name = 'Browse all tags →'
    url = '/tags/'
    weight = 99

  [[menu.main]]
    identifier = 'archive'
    name = 'Archive'
    url = '/posts-list/'
    weight = 40

  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[outputFormats]
  [outputFormats.RSS]
    mediatype = "application/rss"
    baseName = "feed"

[related]
  includeNewer = false
  threshold = 80
  toLower = false
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "tags"
    weight = 80
  [[related.indices]]
    name = "date"
    weight = 10
